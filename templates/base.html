<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}校园搭子{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">🎒 校园搭子</a>
            <div class="nav-links">
                {% if logged_in %}
                    <a href="/publish" class="nav-btn">＋ 发帖</a>
                    <a href="/profile" class="nav-btn">👤 我的</a>
                {% else %}
                    <a href="/login" class="nav-btn">登录</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- 底部导航 -->
    <footer class="footer">
        <p>校园搭子 · 第1迭代MVP版本</p>
    </footer>
</body>
</html>
