{% extends "base.html" %}
{% block title %}与 {{ other.nickname }} 聊天{% endblock %}

{% block content %}
<div class="chat-page">
    <!-- 聊天头部 -->
    <div class="chat-header">
        <div class="chat-header-info">
            {% if other.avatar %}<img src="{{ other.avatar }}" class="chat-header-avatar">{% else %}<div class="chat-header-avatar">👤</div>{% endif %}
            <div>
                <div class="chat-header-name">
                    {{ other.nickname }}
                    {% if other.student_verified %}<span class="verified-tag">🎓 已认证</span>{% endif %}
                </div>
                <div class="chat-status">
                    {% if is_online %}<span class="online-text">🟢 在线</span>
                    {% else %}<span class="offline-text">⚪ 离线</span>{% endif %}
                </div>
            </div>
        </div>
    </div>

    <!-- 消息区 -->
    <div class="chat-messages" id="chat-messages"></div>

    <!-- 输入区 -->
    <div class="chat-input-bar">
        <button class="chat-location-btn" id="btn-location" title="发送我的位置">📍</button>
        <input type="text" id="msg-input" placeholder="输入消息..." autocomplete="off">
        <button class="chat-send-btn" id="btn-send">发送</button>
    </div>
</div>

<script>
const OTHER_ID = {{ other.id }};
let lastMsgId = 0;

const box = document.getElementById('chat-messages');
const input = document.getElementById('msg-input');

function fmtTime(t) { return t || ''; }

function addMsg(m) {
    const div = document.createElement('div');
    div.className = 'msg-row ' + (m.mine ? 'mine' : 'theirs');

    let body;
    if (m.msg_type === 'location') {
        // 位置消息：高德地图链接
        const url = `https://uri.amap.com/marker?position=${m.lng},${m.lat}&name=我的位置&src=校园搭子&coordinate=gaode`;
        body = `<div class="bubble location-bubble">
                    📍 我发送了一个位置<br>
                    <a href="${url}" target="_blank" class="map-link">在地图上查看 →</a>
                </div>`;
    } else {
        body = `<div class="bubble">${escapeHtml(m.content)}</div>`;
    }
    div.innerHTML = `
        ${m.mine ? '' : `<div class="msg-time">${fmtTime(m.time)}</div>`}
        <div class="msg-line">${body}</div>
    `;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    if (m.id > lastMsgId) lastMsgId = m.id;
}

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function loadHistory() {
    fetch(`/chat/${OTHER_ID}/history?after_id=${lastMsgId}`)
        .then(r => r.json())
        .then(data => {
            if (data.code === 0) {
                data.messages.forEach(addMsg);
            }
        });
}

function sendText() {
    const text = input.value.trim();
    if (!text) return;
    const fd = new FormData();
    fd.append('to_user_id', OTHER_ID);
    fd.append('msg_type', 'text');
    fd.append('content', text);
    fetch('/chat/send', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(data => {
            if (data.code === 0) { input.value = ''; loadHistory(); }
            else { alert(data.message); }
        });
}

document.getElementById('btn-send').onclick = sendText;
input.addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });

// 发位置
document.getElementById('btn-location').onclick = function() {
    if (!navigator.geolocation) { alert('浏览器不支持定位'); return; }
    this.textContent = '定位中...';
    navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const fd = new FormData();
        fd.append('to_user_id', OTHER_ID);
        fd.append('msg_type', 'location');
        fd.append('lat', lat);
        fd.append('lng', lng);
        fetch('/chat/send', { method: 'POST', body: fd })
            .then(r => r.json())
            .then(data => {
                document.getElementById('btn-location').textContent = '📍';
                if (data.code === 0) loadHistory();
                else alert(data.message);
            });
    }, err => {
        document.getElementById('btn-location').textContent = '📍';
        alert('定位失败：' + err.message + '（可能是浏览器未授权位置权限）');
    }, { enableHighAccuracy: true, timeout: 10000 });
};

// 启动：加载历史 + 每2秒轮询新消息
loadHistory();
setInterval(loadHistory, 2000);
</script>
{% endblock %}
